<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Turing Machine Simulator</title>
  <meta name="author" content="Andrieli Gonçalves">
  <meta name="description" content="Interactive Turing machine simulator: draw state diagrams, use multiple tapes and step through the run.">
  <script>
    /* apply the saved theme before the first paint, to avoid a flash */
    var th = null;
    try { th = localStorage.getItem('turing-machine-simulator-theme'); } catch (e) {}
    if (th !== 'light' && th !== 'dark') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = th;
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- very faint line drawings of a Turing machine, only visible in the side margins of wide screens -->
<svg class="bg bg-l" viewBox="0 0 260 1080" aria-hidden="true" focusable="false">
  <defs><pattern id="cells-l" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M43.5 0V44"/></pattern></defs>
  <rect x="-2" y="620" width="270" height="44" fill="url(#cells-l)"/>
  <text x="22" y="650">0</text><text x="66" y="650">1</text><text x="110" y="650">1</text><text x="154" y="650">0</text><text x="198" y="650">B</text><text x="242" y="650">1</text>
  <path d="M96 520h84v88h-84z M118 608l22 14 22-14 M110 540h60 M110 556h60"/>
  <path d="M118 268C118 350 146 380 146 440V520 M152 268C152 340 172 372 172 440V520"/>
  <circle cx="135" cy="190" r="82"/><circle cx="135" cy="190" r="58"/><circle cx="135" cy="190" r="12"/>
  <path d="M135 178V132 M146.4 186.3L190.2 172.1 M142.1 199.7L169.1 236.9 M127.9 199.7L100.9 236.9 M123.6 186.3L79.8 172.1"/>
  <circle cx="95" cy="840" r="44" stroke-width="9" stroke-dasharray="8.64 8.64"/><circle cx="95" cy="840" r="32"/><circle cx="95" cy="840" r="8"/>
  <circle cx="178" cy="905" r="28" stroke-width="8" stroke-dasharray="8.8 8.8"/><circle cx="178" cy="905" r="18"/><circle cx="178" cy="905" r="6"/>
  <rect x="30" y="960" width="200" height="86"/><circle cx="62" cy="1003" r="14"/><path d="M62 1003l8-8"/>
  <circle cx="110" cy="985" r="5"/><circle cx="130" cy="985" r="5"/><circle cx="150" cy="985" r="5"/><path d="M100 1022H220"/>
  <text x="188" y="1008">q0</text>
</svg>
<svg class="bg bg-r" viewBox="0 0 260 1080" aria-hidden="true" focusable="false">
  <defs><pattern id="cells-r" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M43.5 0V44"/></pattern></defs>
  <rect x="-2" y="620" width="270" height="44" fill="url(#cells-r)"/>
  <text x="22" y="650">B</text><text x="66" y="650">1</text><text x="110" y="650">0</text><text x="154" y="650">0</text><text x="198" y="650">1</text><text x="242" y="650">B</text>
  <path d="M100 520h84v88h-84z M122 608l20 14 20-14 M114 540h56 M114 556h56"/>
  <path d="M118 398C118 440 140 470 140 520 M148 396C148 440 160 470 160 520"/>
  <circle cx="130" cy="330" r="70"/><circle cx="130" cy="330" r="48"/><circle cx="130" cy="330" r="10"/>
  <path d="M130 320V282 M139.5 327L175.6 315.3 M135.9 338.1L158.2 368.7 M124.1 338.1L101.8 368.7 M120.5 327L84.4 315.3"/>
  <rect x="30" y="70" width="200" height="120"/>
  <circle cx="82" cy="130" r="36"/><circle cx="82" cy="130" r="30" stroke-dasharray="2 8"/><path d="M82 130l18-22"/>
  <rect x="140" y="98" width="14" height="44"/><rect x="164" y="98" width="14" height="44"/><rect x="188" y="98" width="14" height="44"/>
  <path d="M147 98v18 M171 124v18 M195 98v18 M30 160h200"/>
  <circle cx="150" cy="850" r="52" stroke-width="9" stroke-dasharray="10.2 10.2"/><circle cx="150" cy="850" r="38"/><circle cx="150" cy="850" r="9"/>
  <circle cx="62" cy="930" r="30" stroke-width="8" stroke-dasharray="9.4 9.4"/><circle cx="62" cy="930" r="19"/><circle cx="62" cy="930" r="6"/>
  <text x="206" y="1030">q1</text>
</svg>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="top-actions">
      <label for="examples" class="sr" data-i18n="examples_label"></label>
      <select id="examples">
        <option value="" data-i18n="ex_placeholder"></option>
        <option value="abc" data-i18n="ex_abc"></option>
        <option value="inc" data-i18n="ex_inc"></option>
        <option value="copy" data-i18n="ex_copy"></option>
        <option value="copy2" data-i18n="ex_copy2"></option>
        <option value="soma" data-i18n="ex_soma"></option>
        <option value="nd" data-i18n="ex_nd"></option>
        <option value="vazio" data-i18n="ex_vazio"></option>
      </select>
      <label for="lang" class="sr" data-i18n="lang_label"></label>
      <select id="lang">
        <option value="pt">Português</option>
        <option value="en">English</option>
      </select>
      <label for="theme" class="sr" data-i18n="theme_label"></label>
      <select id="theme">
        <option value="light" data-i18n="theme_light"></option>
        <option value="dark" data-i18n="theme_dark"></option>
      </select>
      <button class="btn" id="btn-io" type="button" data-i18n="io_btn"></button>
    </div>
  </header>

  <main class="work">
    <section class="board" id="board" data-tool="select" data-i18n-aria="board_aria">
      <div class="toolbar" id="toolbar">
        <div class="grp nd-only" role="group" data-i18n-aria="views_aria">
          <button class="btn" type="button" data-view="diagram" aria-pressed="true" data-i18n="view_diagram"></button>
          <button class="btn" type="button" data-view="tree" aria-pressed="false" data-i18n="view_tree"></button>
        </div>
        <div class="grp tools" role="group" data-i18n-aria="tools_aria">
          <button class="btn" type="button" data-tool="select" aria-pressed="true"><span data-i18n="tool_select"></span> <kbd>V</kbd></button>
          <button class="btn" type="button" data-tool="state" aria-pressed="false"><span data-i18n="tool_state"></span> <kbd>E</kbd></button>
          <button class="btn" type="button" data-tool="edge" aria-pressed="false"><span data-i18n="tool_edge"></span> <kbd>T</kbd></button>
          <button class="btn" type="button" data-tool="pan" aria-pressed="false"><span data-i18n="tool_pan"></span> <kbd>H</kbd></button>
        </div>
        <div class="grp hist" role="group" data-i18n-aria="hist_aria">
          <button class="btn" type="button" data-act="undo" data-i18n="undo" data-i18n-title="undo_title"></button>
          <button class="btn" type="button" data-act="redo" data-i18n="redo" data-i18n-title="redo_title"></button>
        </div>
        <div class="grp" role="group" data-i18n-aria="zoom_aria">
          <button class="btn" type="button" data-act="zoomout" data-i18n-aria="zoom_out_aria">−</button>
          <button class="btn" type="button" data-act="fit" data-i18n="fit"></button>
          <button class="btn" type="button" data-act="zoomin" data-i18n-aria="zoom_in_aria">+</button>
        </div>
        <div class="grp" role="group" data-i18n-aria="export_aria">
          <button class="btn" type="button" id="png-save" data-i18n="save_png"></button>
          <button class="btn" type="button" id="png-copy" data-i18n="copy_png"></button>
        </div>
      </div>
      <svg id="svg" role="img" data-i18n-aria="svg_aria">
        <g id="vp"></g>
      </svg>
      <p class="hint" id="hint"></p>
      <div class="tree" id="tree">
        <p class="tree-empty" id="tree-empty" data-i18n="tree_empty"></p>
        <svg id="tsvg" role="img" data-i18n-aria="tree_aria"><g id="tvp"></g></svg>
      </div>
    </section>
    <aside class="inspector" id="inspector" aria-live="polite"></aside>
  </main>

  <section class="tape-panel" id="tape-panel" data-status="idle" data-i18n-aria="tapes_aria">
    <div class="tape-top">
      <div class="left">
        <h2 data-i18n="tapes"></h2>
        <div class="counter" role="group" data-i18n-aria="count_aria">
          <button class="btn sm" type="button" id="k-minus" data-i18n-aria="k_minus_aria">−</button>
          <output id="k-out" for="k-minus k-plus"></output>
          <button class="btn sm" type="button" id="k-plus" data-i18n-aria="k_plus_aria">+</button>
        </div>
        <span class="tag" id="tape-tag"></span>
      </div>
      <div class="tape-tools">
        <label class="check" for="nd"><input type="checkbox" id="nd"> <span data-i18n="nd_label"></span></label>
        <label for="blank"><span data-i18n="blank"></span> <input type="text" id="blank" maxlength="1" autocomplete="off" spellcheck="false"></label>
        <button class="btn sm" type="button" id="b-gohead" data-i18n="goto_heads"></button>
      </div>
    </div>
    <div class="gamma" id="gamma">
      <span class="gl">Γ = {</span><span class="gchips" id="g-chips"></span><span class="gl">}</span>
      <label class="sr" for="g-add" data-i18n="gamma_new_sr"></label>
      <input type="text" id="g-add" data-i18n-ph="gamma_ph" autocomplete="off" spellcheck="false">
      <button class="btn" type="button" id="g-btn" data-i18n="gamma_add"></button>
      <button class="btn" type="button" id="g-fill" data-i18n="gamma_fill" data-i18n-title="gamma_fill_title"></button>
    </div>
    <div class="tapes" id="tapes"></div>
    <div class="controls">
      <div class="grp">
        <button class="btn" type="button" id="b-reset" data-i18n="reset"></button>
        <button class="btn" type="button" id="b-step" data-i18n="step"></button>
        <button class="btn primary" type="button" id="b-run"></button>
      </div>
      <label class="speed" for="speed"><span data-i18n="speed"></span>
        <input type="range" id="speed" min="1" max="60" value="4">
        <output id="speed-out" for="speed"></output>
      </label>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
  </section>
  <footer class="foot">© 2026, Andrieli Gonçalves, <a href="mailto:alg24@inf.ufpr.br">alg24@inf.ufpr.br</a></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title" data-i18n="io_title"></h2>
    <p class="note" data-i18n="io_help"></p>
    <textarea id="io-text" spellcheck="false" data-i18n-aria="io_aria"></textarea>
    <p class="err" id="io-err"></p>
    <div class="row">
      <button class="btn" type="button" id="io-copy" data-i18n="io_copy"></button>
      <button class="btn primary" type="button" id="io-load" data-i18n="io_load"></button>
      <button class="btn" type="button" id="io-close" data-i18n="io_close"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/model.js"></script>
<script src="js/examples.js"></script>
<script src="js/storage.js"></script>
<script src="js/geometry.js"></script>
<script src="js/diagram.js"></script>
<script src="js/editing.js"></script>
<script src="js/pointer.js"></script>
<script src="js/toolbar.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/panels.js"></script>
<script src="js/inspector.js"></script>
<script src="js/tape-view.js"></script>
<script src="js/tape-edit.js"></script>
<script src="js/run.js"></script>
<script src="js/controls.js"></script>
<script src="js/branches.js"></script>
<script src="js/branch-panels.js"></script>
<script src="js/tree.js"></script>
<script src="js/png.js"></script>
<script src="js/alphabet.js"></script>
<script src="js/files.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
